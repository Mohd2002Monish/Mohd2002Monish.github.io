<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Theme Gradients -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </linearGradient>
    <linearGradient id="m-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ebe8df" />
    </linearGradient>

    <!-- Electric Orange Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a2b" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>

    <!-- Soft Glow Filter for the Accent Dot -->
    <filter id="accent-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .fav-bg {
      fill: url(#bg-grad-dark);
      stroke: rgba(240, 239, 236, 0.12);
      stroke-width: 1.5;
    }
    .fav-grid {
      stroke: rgba(240, 239, 236, 0.05);
      stroke-width: 1;
    }
    .fav-cross {
      stroke: rgba(240, 239, 236, 0.28);
      stroke-width: 1.25;
      stroke-linecap: round;
    }
    .fav-letter {
      fill: url(#m-grad-dark);
    }
    .fav-accent {
      fill: url(#accent-grad);
      filter: url(#accent-glow);
    }

    @media (prefers-color-scheme: light) {
      .fav-bg {
        fill: #f4f3ef;
        stroke: rgba(23, 22, 19, 0.15);
      }
      .fav-grid {
        stroke: rgba(23, 22, 19, 0.04);
      }
      .fav-cross {
        stroke: rgba(23, 22, 19, 0.3);
      }
      .fav-letter {
        fill: #171613;
      }
      .fav-accent {
        fill: #e04300;
        filter: none;
      }
    }
  </style>

  <!-- Squircle Base -->
  <rect class="fav-bg" x="1.5" y="1.5" width="61" height="61" rx="16" />

  <!-- Blueprint Subtle Grid Lines -->
  <line class="fav-grid" x1="1.5" y1="32" x2="62.5" y2="32" />
  <line class="fav-grid" x1="32" y1="1.5" x2="32" y2="62.5" />

  <!-- Technical Registration Crosshairs (Top-Left and Bottom-Right) -->
  <path class="fav-cross" d="M 6.5 10 H 12.5 M 9.5 7 V 13" />
  <path class="fav-cross" d="M 51.5 54 H 57.5 M 54.5 51 V 57" />

  <!-- Architectural "M" Monogram -->
  <path class="fav-letter" fill-rule="evenodd" d="
    M 13.5 19
    L 13.5 46
    L 21.5 46
    L 21.5 30
    L 32 42.5
    L 42.5 30
    L 42.5 46
    L 50.5 46
    L 50.5 19
    L 42.5 19
    L 32 31.5
    L 21.5 19
    Z
  " />

  <!-- Signature Electric Orange Brand Accent Square (Top-Right) -->
  <rect class="fav-accent" x="43.5" y="8" width="8" height="8" rx="2" />
</svg>